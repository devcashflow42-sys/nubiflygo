<!doctype html>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Base de rutas. En el servidor la app vive también en /project/<id>,
       /settings…, así que la base es la raíz "/" para que css/ y js/ carguen
       siempre bien. Si el archivo se abre localmente (file://), la base pasa a
       ser su propia carpeta, de modo que el diseño aparece igual sin servidor. -->
  <script>
    (function () {
      var base = '/';
      if (location.protocol === 'file:') {
        base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
      }
      document.write('<base href="' + base + '">');
    })();
  </script>

    img { max-width: 100%; }
    [hidden]:not([hidden="until-found" i]) { display: none !important; }
  </style>
