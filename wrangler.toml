# Configuración de Cloudflare Pages para NubiFlyGo
# Nombre del proyecto en Cloudflare Pages (nubiflygo.pages.dev).
name = "nubiflygo"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"
# Necesario para @neondatabase/serverless en las Functions:
compatibility_flags = ["nodejs_compat"]
